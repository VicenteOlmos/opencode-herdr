# npm OIDC trusted publishing — no NPM_TOKEN, no local OTP.
#
# One-time on https://www.npmjs.com/package/opencode-herdr → Settings → Trusted Publisher:
#   Organization or user: VicenteOlmos
#   Repository: opencode-herdr
#   Workflow filename: publish.yml
#   Allowed actions: enable npm publish (required for publishers created after 2026-09-03)
#
# Then: bump package.json, tag/release vX.Y.Z, or Actions → Publish → Run workflow.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Stub runtime CLIs on PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          for name in herdr agent opencode claude codex; do
            printf '%s\n' '#!/bin/sh' 'if [ "$1" = "--version" ] || [ "$1" = "version" ]; then printf "1.0.0\n"; exit 0; fi' 'printf %s "{\"models\":[\"safe\"]}"' 'exit 0' > "$HOME/.local/bin/$name"
            chmod +x "$HOME/.local/bin/$name"
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # Do not set registry-url: setup-node then injects a dummy NODE_AUTH_TOKEN
      # and npm uses that instead of OIDC trusted publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "ACTIONS_ID_TOKEN_REQUEST_URL missing; id-token: write was not granted"
            exit 1
          fi
          npm publish --access public --loglevel verbose
